; Seeed Studio XIAO ESP32-C3 — Wi-Fi analyzer firmware (ESP-IDF via PlatformIO)
[platformio]
src_dir = main

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = espidf
monitor_speed = 115200
build_flags = -Wall -Wextra

; Milestone-1 build: prints live statistics as text on the serial console
; instead of emitting the binary telemetry protocol.  Use with `pio device monitor`.
[env:text]
extends = env:seeed_xiao_esp32c3
build_flags =
    ${env:seeed_xiao_esp32c3.build_flags}
    -DANALYZER_TEXT_MODE=1
